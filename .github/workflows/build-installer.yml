name: Build Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - '.github/workflows/build-installer.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Volta
        uses: volta-cli/action@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          shared-key: office-preview-release
          workspaces: src-tauri
          cache-on-failure: true

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app (NSIS installer)
        run: npm run tauri:build -- --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''

      - name: List build outputs
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Path src-tauri/target/release/bundle -File -ErrorAction SilentlyContinue |
            ForEach-Object { "$($_.FullName)  ($([math]::Round($_.Length/1MB,1)) MB)" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: sfm-office-preview-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 30

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: sfm-office-preview-portable
          path: src-tauri/target/release/*.exe
          if-no-files-found: warn
          retention-days: 30
