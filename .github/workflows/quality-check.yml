name: Quality Check

# 运行上游完整的质量门（含 lint:check --max-warnings 0），补上 verify 工作流未覆盖的部分

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Volta
        uses: volta-cli/action@v4

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run ts

      - name: Lint (eslint + stylelint, max-warnings 0)
        run: npm run lint:check

      - name: Unit tests
        run: npm run test
